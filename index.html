<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كابتن إيهاب الشريف - التدريب الشخصي والبرامج التدريبية</title>
  <style>
    /* ===== المتغيرات والتنسيقات الأساسية ===== */
    :root {
      --primary: #d32f2f;
      --primary-dark: #b71c1c;
      --accent: #ff9800;
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-light: #2c2c2c;
      --text: #ffffff;
      --text-sub: #b0b0b0;
      --success: #2e7d32;
      --radius: 12px;
      --shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 40px;
    }

    body.locked {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ===== الهيدر والترويسة ===== */
    header {
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%), var(--surface);
      padding: 24px 16px;
      text-align: center;
      border-bottom: 1px solid var(--surface-light);
      position: relative;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--text);
      margin-bottom: 4px;
    }

    header p {
      color: var(--accent);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .admin-nav-link {
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 0.8rem;
      color: var(--text-sub);
      background: var(--surface-light);
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
    }

    /* ===== شاشة تسجيل الدخول / البوابة ===== */
    #gate {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(8px);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
      border: 1px solid var(--surface-light);
    }

    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--surface-light);
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      color: var(--text-sub);
      cursor: pointer;
      transition: 0.3s;
    }

    .tab.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--surface-light);
      background: #141414;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--primary);
    }

    .form-group input.bad {
      border-color: var(--primary);
      background: rgba(211, 47, 47, 0.1);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .msg-error {
      color: #ff5252;
      font-size: 0.85rem;
      margin-top: 8px;
      text-align: center;
    }

    /* ===== الترحيب ورابط الخروج للعميل ===== */
    #welcome {
      background: var(--surface);
      padding: 12px 16px;
      border-bottom: 1px solid var(--surface-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #welcome span {
      font-weight: bold;
      color: var(--accent);
    }

    .logout-btn {
      background: transparent;
      border: 1px solid var(--surface-light);
      color: var(--text-sub);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* ===== لوحة تحكم الأدمن ===== */
    #admin-app {
      padding-top: 20px;
    }

    .admin-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: var(--surface);
      padding: 12px 16px;
      border-radius: var(--radius);
    }

    .atabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .atab {
      flex: 1;
      padding: 10px;
      background: var(--surface);
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
      border: 1px solid var(--surface-light);
    }

    .atab.active {
      background: var(--primary);
      border-color: var(--primary);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--surface);
      padding: 16px;
      border-radius: var(--radius);
      text-align: center;
      border: 1px solid var(--surface-light);
    }

    .stat-card div {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent);
    }

    .stat-card small {
      color: var(--text-sub);
      font-size: 0.8rem;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item {
      background: var(--surface);
      padding: 14px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--surface-light);
    }

    .item .who strong {
      display: block;
      font-size: 1rem;
    }

    .item .who small {
      color: var(--text-sub);
      font-size: 0.75rem;
    }

    .item .phone {
      direction: ltr;
      font-family: monospace;
      color: var(--accent);
    }

    .chip {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      display: inline-block;
    }

    .chip.wa {
      background: #25d366;
      color: #000;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: var(--text-sub);
    }

    .code-box {
      background: #141414;
      padding: 16px;
      border-radius: 8px;
      border: 1px dashed var(--accent);
      margin-top: 16px;
      text-align: center;
    }

    .code-box code {
      font-size: 1.6rem;
      letter-spacing: 2px;
      color: var(--accent);
      display: block;
      margin: 10px 0;
    }
  </style>
</head>
<body class="locked">

  <!-- هيدر الصفحة -->
  <header>
    <span class="admin-nav-link" id="admin-link">لوحة الإدارة</span>
    <h1>كابتن إيهاب الشريف</h1>
    <p>التدريب الشخصي والمتابعة الأونلاين</p>
  </header>

  <!-- شاشة الترحيب للعميل عند تسجيل الدخول -->
  <div id="welcome" hidden>
    <div>أهلاً بك 👋 <span id="client-name-display"></span></div>
    <button class="logout-btn" id="client-logout">تسجيل خروج</button>
  </div>

  <!-- بوابة تسجيل الدخول (للعميل والأدمن) -->
  <div id="gate">
    <div class="card">
      <div class="tabs">
        <div class="tab active" data-tab="client">دخول المشتركين</div>
        <div class="tab" data-tab="admin">الأدمن</div>
      </div>

      <!-- نموذج دخول العميل -->
      <form id="client-form">
        <div class="form-group">
          <label for="c-fullname">الاسم بالكامل</label>
          <input type="text" id="c-fullname" placeholder="اكتب اسمك الثلاثي" required>
        </div>
        <div class="form-group">
          <label for="c-phone-num">رقم الموبايل (واتساب)</label>
          <input type="tel" id="c-phone-num" placeholder="01xxxxxxxxx" dir="ltr" required>
        </div>
        <button type="submit" class="btn">دخول للبرامج التدريبية</button>
      </form>

      <!-- نموذج دخول الأدمن -->
      <form id="admin-form" hidden>
        <div class="form-group">
          <label for="a-key">كلمة سر الإدارة</label>
          <input type="password" id="a-key" placeholder="••••••••" dir="ltr" required>
        </div>
        <button type="submit" class="btn" id="admin-btn">تسجيل الدخول كأدمن</button>
        <div class="msg-error" id="a-msg"></div>
      </form>
    </div>
  </div>

  <!-- محتوى التطبيق للأدمن -->
  <main class="container" id="admin-app" hidden>
    <div class="admin-bar">
      <div><strong>لوحة التحكم</strong></div>
      <div>
        <button class="logout-btn" id="refresh">تحديث ↻</button>
        <button class="logout-btn" id="home-link">الرئيسية</button>
        <button class="logout-btn" id="logout">خروج</button>
      </div>
    </div>

    <div class="atabs">
      <div class="atab active" data-atab="leads">بيانات المشتركين</div>
      <div class="atab" data-atab="codes">إنشاء كود تفعيل</div>
    </div>

    <!-- تبويب المشتركين -->
    <div id="pane-leads">
      <div class="stats">
        <div class="stat-card">
          <div id="s-total">0</div>
          <small>إجمالي التسجيلات</small>
        </div>
        <div class="stat-card">
          <div id="s-today">0</div>
          <small>اليوم</small>
        </div>
        <div class="stat-card">
          <div id="s-week">0</div>
          <small>هذا الأسبوع</small>
        </div>
      </div>

      <div class="form-group">
        <input type="text" id="search" placeholder="بحث بالاسم أو رقم الهاتف…">
      </div>

      <div id="app-msg" class="msg-error" style="margin-bottom: 10px;"></div>
      <div class="list" id="list"></div>
    </div>

    <!-- تبويب إنشاء الأكواد -->
    <div id="pane-codes" hidden>
      <div class="card" style="max-width: 100%;">
        <h3>إنشاء كود تفعيل جديد</h3>
        <br>
        <div class="form-group">
          <label>اسم العميل</label>
          <input type="text" id="c-name" placeholder="اسم العميل">
        </div>
        <div class="form-group">
          <label>رقم هاتف العميل</label>
          <input type="tel" id="c-phone" placeholder="01xxxxxxxxx" dir="ltr">
        </div>
        <button class="btn" id="c-create">إنشاء الكود الآن</button>
        <div class="msg-error" id="c-msg"></div>

        <div class="code-box" id="c-result" hidden>
          <span id="c-result-label">كود التفعيل:</span>
          <code id="c-result-code">XXXXXX</code>
          <div style="display: flex; gap: 8px; margin-top: 10px;">
            <button class="btn" id="c-copy" style="background: var(--surface-light);">نسخ الكود</button>
            <a class="btn" id="c-wa" style="background: #25d366; color: #000; text-align: center;" target="_blank" rel="noopener">إرسال عبر الواتساب</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- الجافاسكريبت والربط البرمجي -->
  <script>
    var LEAD_ENDPOINT = ''; // وضع رابط Google Apps Script الخاص بك هنا إن وجد
    var KEY = 'ehab_client_data';

    // دالة JSONP للاتصال بالخادم
    function jsonp(params, callback) {
      if (!LEAD_ENDPOINT) {
        if (callback) callback({ ok: false, msg: 'لا يوجد رابط للخدمة' });
        return;
      }
      var cbName = 'jsonp_cb_' + Math.round(100000 * Math.random());
      window[cbName] = function (data) {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        if (callback) callback(data);
      };
      params.callback = cbName;
      var q = [];
      for (var k in params) {
        if (params.hasOwnProperty(k)) {
          q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
        }
      }
      var script = document.createElement('script');
      script.src = LEAD_ENDPOINT + '?' + q.join('&');
      document.body.appendChild(script);
    }

    function normalizePhone(p) {
      return p.replace(/[^\d]/g, '');
    }

    // إدارة تبويبات النافذة المنسدلة (العميل / الأدمن)
    (function () {
      var gate = document.getElementById('gate');
      var tabs = document.querySelectorAll('.tab');
      var form = document.getElementById('client-form');
      var adminForm = document.getElementById('admin-form');
      var nameEl = document.getElementById('c-fullname');
      var phoneEl = document.getElementById('c-phone-num');

      function showTab(which) {
        tabs.forEach(function (t) {
          t.classList.toggle('active', t.getAttribute('data-tab') === which);
        });
        form.hidden = which !== 'client';
        adminForm.hidden = which !== 'admin';
      }

      function unlock(user, save) {
        document.body.classList.remove('locked');
        gate.hidden = true;
        var welcome = document.getElementById('welcome');
        welcome.hidden = false;
        document.getElementById('client-name-display').textContent = user.name;
      }

      tabs.forEach(function (t) {
        t.addEventListener('click', function () { showTab(t.getAttribute('data-tab')); });
      });

      var adminLink = document.getElementById('admin-link');
      if (adminLink) {
        adminLink.addEventListener('click', function (e) {
          e.preventDefault();
          document.body.classList.add('locked');
          gate.hidden = false;
          showTab('admin');
        });
      }

      // ===== تسجيل خروج العميل =====
      var clientLogoutBtn = document.getElementById('client-logout');
      if (clientLogoutBtn) {
        clientLogoutBtn.addEventListener('click', function () {
          try {
            localStorage.removeItem(KEY);
          } catch (e) {}
          document.getElementById('welcome').hidden = true;
          document.body.classList.add('locked');
          gate.hidden = false;
          showTab('client');
          nameEl.value = '';
          phoneEl.value = '';
        });
      }

      // ===== إرسال نموذج العميل =====
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var name = nameEl.value.trim();
        var phone = normalizePhone(phoneEl.value.trim());

        var validName = name.length >= 2;
        var validPhone = /^01[0125]\d{8}$/.test(phone);

        nameEl.classList.toggle('bad', !validName);
        phoneEl.classList.toggle('bad', !validPhone);

        if (!validName || !validPhone) return;

        var visitorData = { name: name, phone: phone, time: new Date().toISOString() };
        try {
          localStorage.setItem(KEY, JSON.stringify(visitorData));
        } catch (err) {}

        // إرسال البيانات للخادم
        if (LEAD_ENDPOINT) {
          jsonp({ action: 'register', name: name, phone: phone }, function () {});
        }

        unlock(visitorData, true);
      });

      // التحقق من الجلسة السابقة للعميل
      try {
        var saved = localStorage.getItem(KEY);
        if (saved) {
          var user = JSON.parse(saved);
          if (user && user.name && user.phone) {
            unlock(user, false);
            return;
          }
        }
      } catch (e) {}
    })();

    // ===== نسخ البيانات للحافظة =====
    document.querySelectorAll('[data-copy]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var text = btn.getAttribute('data-copy');
        if (!text) return;
        var orig = btn.textContent;
        navigator.clipboard.writeText(text).then(function () {
          btn.textContent = 'تم النسخ! ✓';
          setTimeout(function () { btn.textContent = orig; }, 2000);
        }).catch(function () {
          btn.textContent = 'عذراً، فشل النسخ';
          setTimeout(function () { btn.textContent = orig; }, 2000);
        });
      });
    });

    // ===== لوحة التحكم للأدمن =====
    (function () {
      var adminForm = document.getElementById('admin-form');
      var keyEl = document.getElementById('a-key');
      var aMsg = document.getElementById('a-msg');
      var adminBtn = document.getElementById('admin-btn');
      var adminApp = document.getElementById('admin-app');
      var gate = document.getElementById('gate');
      var currentAdminKey = '';

      var paneLeads = document.getElementById('pane-leads');
      var paneCodes = document.getElementById('pane-codes');
      var atabs = document.querySelectorAll('.atab');

      function showAdminPane(which) {
        atabs.forEach(function (t) {
          var on = t.getAttribute('data-atab') === which;
          t.classList.toggle('active', on);
        });
        paneLeads.hidden = which !== 'leads';
        paneCodes.hidden = which !== 'codes';
      }

      atabs.forEach(function (t) {
        t.addEventListener('click', function () { showAdminPane(t.getAttribute('data-atab')); });
      });

      function loadLeads() {
        var appMsg = document.getElementById('app-msg');
        appMsg.textContent = 'جاري تحميل البيانات…';

        jsonp({ action: 'get_leads', key: currentAdminKey }, function (res) {
          if (!res || !res.ok) {
            appMsg.textContent = 'كلمة السر غير صحيحة أو حدث خطأ في الاتصال.';
            return;
          }
          appMsg.textContent = '';
          var data = res.leads || [];

          // تحديث الإحصائيات
          document.getElementById('s-total').textContent = data.length;
          var todayCount = 0, weekCount = 0;
          var now = new Date();
          var todayStr = now.toISOString().slice(0, 10);
          var weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

          data.forEach(function (item) {
            if (!item.time) return;
            if (item.time.slice(0, 10) === todayStr) todayCount++;
            if (new Date(item.time) >= weekAgo) weekCount++;
          });

          document.getElementById('s-today').textContent = todayCount;
          document.getElementById('s-week').textContent = weekCount;

          renderLeads(data);
        });
      }

      function renderLeads(leads) {
        var listEl = document.getElementById('list');
        var searchVal = (document.getElementById('search').value || '').toLowerCase().trim();
        listEl.innerHTML = '';

        var filtered = leads.filter(function (item) {
          var name = (item.name || '').toLowerCase();
          var phone = (item.phone || '').toLowerCase();
          return name.indexOf(searchVal) !== -1 || phone.indexOf(searchVal) !== -1;
        });

        if (filtered.length === 0) {
          listEl.innerHTML = '<div class="empty">لا توجد نتائج للعرض.</div>';
          return;
        }

        filtered.forEach(function (item, idx) {
          var div = document.createElement('div');
          div.className = 'item';

          var dateFormatted = item.time ? new Date(item.time).toLocaleString('ar-EG') : 'غير محدد';
          var waLink = 'https://wa.me/20' + (item.phone || '').replace(/^0/, '');

          div.innerHTML =
            '<div class="who">' +
              '<strong>' + (item.name || 'بدون اسم') + '</strong>' +
              '<small>' + dateFormatted + '</small>' +
            '</div>' +
            '<div class="phone">' + (item.phone || '—') + '</div>' +
            '<div class="acts">' +
              '<a class="chip wa" href="' + waLink + '" target="_blank" rel="noopener">واتساب</a>' +
            '</div>';

          listEl.appendChild(div);
        });
      }

      document.getElementById('search').addEventListener('input', function () {
        jsonp({ action: 'get_leads', key: currentAdminKey }, function (res) {
          if (res && res.ok) renderLeads(res.leads || []);
        });
      });

      // ===== إنشاء الأكواد للأدمن =====
      var createBtn = document.getElementById('c-create');
      if (createBtn) {
        createBtn.addEventListener('click', function () {
          var cName = document.getElementById('c-name').value.trim();
          var cPhone = document.getElementById('c-phone').value.trim();
          var cMsg = document.getElementById('c-msg');
          var cResult = document.getElementById('c-result');

          if (!cName) {
            cMsg.textContent = 'من فضلك اكتب اسم العميل.';
            return;
          }
          cMsg.textContent = '';
          createBtn.disabled = true;

          jsonp({ action: 'create_code', key: currentAdminKey, client_name: cName, client_phone: cPhone }, function (res) {
            createBtn.disabled = false;
            if (res && res.ok) {
              cResult.hidden = false;
              document.getElementById('c-result-label').textContent = 'كود التفعيل الخاص بـ ' + cName + ':';
              document.getElementById('c-result-code').textContent = res.code;

              var waText = 'أهلاً يا ' + cName + ' 👋\nكود تفعيل اشتراكك في البرامج التدريبية الخاصة بكابتن إيهاب الشريف هو:\n' + res.code;
              var waUrl = 'https://wa.me/20' + cPhone.replace(/^0/, '') + '?text=' + encodeURIComponent(waText);
              document.getElementById('c-wa').href = waUrl;

              document.getElementById('c-copy').onclick = function () {
                navigator.clipboard.writeText(res.code);
                this.textContent = 'تم النسخ! ✓';
                var self = this;
                setTimeout(function () { self.textContent = 'نسخ الكود'; }, 2000);
              };

              document.getElementById('c-name').value = '';
              document.getElementById('c-phone').value = '';
            } else {
              cMsg.textContent = 'فشل إنشاء الكود. اتأكد من كلمة السر.';
            }
          });
        });
      }

      // ===== تسجيل دخول الأدمن =====
      adminForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var key = keyEl.value.trim();
        if (!key) {
          aMsg.textContent = 'اكتب كلمة السر من فضلك.';
          return;
        }
        aMsg.textContent = '';
        adminBtn.disabled = true;

        jsonp({ action: 'get_leads', key: key }, function (res) {
          adminBtn.disabled = false;
          if (res && res.ok) {
            currentAdminKey = key;
            document.body.classList.remove('locked');
            document.body.classList.add('admin-mode');
            gate.hidden = true;
            adminApp.hidden = false;
            loadLeads();
          } else {
            aMsg.textContent = 'كلمة السر غير صحيحة.';
          }
        });
      });

      // ===== أزرار الإدارة العلويّة =====
      document.getElementById('refresh').addEventListener('click', function () {
        if (currentAdminKey) loadLeads();
      });

      document.getElementById('logout').addEventListener('click', function () {
        currentAdminKey = '';
        adminApp.hidden = true;
        document.body.classList.remove('admin-mode');
        document.body.classList.add('locked');
        gate.hidden = false;
        keyEl.value = '';
      });

      document.getElementById('home-link').addEventListener('click', function () {
        adminApp.hidden = true;
        document.body.classList.remove('admin-mode');
        window.scrollTo(0, 0);
      });
    })();
  </script>
</body>
</html>
