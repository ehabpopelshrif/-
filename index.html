<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة المشتركين - Captain Ehab</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --border: #334155;
      --accent: #10b981;
      --accent-hover: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 750px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: #0f172a;
    }

    .tab-btn {
      flex: 1;
      padding: 16px;
      border: none;
      background: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      color: #94a3b8;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--accent);
      border-bottom: 3px solid var(--accent);
    }

    .tab-content {
      padding: 28px;
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    h2 {
      margin-bottom: 20px;
      color: #fff;
      font-size: 1.4rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: #cbd5e1;
    }

    input, select {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .btn:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    .btn-admin {
      background: var(--primary);
      color: #fff;
    }

    .btn-admin:hover {
      background: var(--primary-hover);
    }

    .success-msg {
      display: none;
      text-align: center;
      color: #34d399;
      margin-top: 18px;
      font-weight: bold;
      background: rgba(16, 185, 129, 0.1);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #10b981;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 12px;
      text-align: right;
      font-size: 0.9rem;
    }

    th {
      background: #0f172a;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- تبويبات النظام -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('client-tab', event)">تسجيل بيانات المشترك</button>
      <button class="tab-btn" onclick="switchTab('admin-tab', event)">لوحة الأدمن</button>
    </div>

    <!-- 1. تبويب وتسجيل العميل (مدمج داخله كافة البيانات البدنية) -->
    <div id="client-tab" class="tab-content active">
      <h2>تسجيل البيانات البدنية للمشترك</h2>
      <form id="clientForm" onsubmit="processAndSend(event)">
        <div class="form-group">
          <label>الاسم بالكامل:</label>
          <input type="text" id="clientName" placeholder="أدخل اسمك بالكامل" required>
        </div>

        <div class="form-group">
          <label>النوع:</label>
          <select id="clientGender" required>
            <option value="male">ذكر</option>
            <option value="female">أنثى</option>
          </select>
        </div>

        <div class="form-group">
          <label>السن (بالسنوات):</label>
          <input type="number" id="clientAge" placeholder="مثال: 25" required>
        </div>

        <div class="form-group">
          <label>الوزن الحالي (كجم):</label>
          <input type="number" id="clientWeight" step="0.1" placeholder="مثال: 80" required>
        </div>

        <div class="form-group">
          <label>الطول (سم):</label>
          <input type="number" id="clientHeight" placeholder="مثال: 175" required>
        </div>

        <div class="form-group">
          <label>مستوى النشاط والمجهود البدني:</label>
          <select id="clientActivity" required>
            <option value="1.2">خامل (قليل الحركة / بدون تمارين)</option>
            <option value="1.375">خفيف (تمارين 1-3 أيام في الأسبوع)</option>
            <option value="1.55">متوسط (تمارين 3-5 أيام في الأسبوع)</option>
            <option value="1.725">عالي (تمارين شاقة 6-7 أيام في الأسبوع)</option>
            <option value="1.9">عالي جداً (رياضي محترف / مجهود شاق)</option>
          </select>
        </div>

        <button type="submit" class="btn">إرسال البيانات لكابتن إيهاب</button>
      </form>

      <div id="successMessage" class="success-msg">
        ✓ تم حفظ بياناتك بنجاح! جاري تحويلك للتواصل مع كابتن إيهاب عبر الواتساب...
      </div>
    </div>

    <!-- 2. تبويب لوحة الأدمن -->
    <div id="admin-tab" class="tab-content">
      <h2>إدارة المشتركين (الأدمن)</h2>
      <form id="addClientForm" onsubmit="addClient(event)">
        <div class="form-group">
          <label for="adminName">اسم المشترك</label>
          <input type="text" id="adminName" required>
        </div>
        <div class="form-group">
          <label for="adminCode">كود / رقم المشترك</label>
          <input type="text" id="adminCode" required>
        </div>
        <div class="form-group">
          <label for="adminPlan">نوع الاشتراك / الباقة</label>
          <input type="text" id="adminPlan" placeholder="مثال: باقة 3 شهور VIP" required>
        </div>
        <div class="form-group">
          <label for="adminExpiry">تاريخ الانتهاء</label>
          <input type="date" id="adminExpiry" required>
        </div>
        <button type="submit" class="btn btn-admin">إضافة / تحديث البيانات</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>الكود</th>
            <th>الاسم</th>
            <th>الباقة</th>
            <th>تاريخ الانتهاء</th>
          </tr>
        </thead>
        <tbody id="clientsTableBody">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // 1. التنقل بين التبويبات
    function switchTab(tabId, evt) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');
    }

    // 2. إدارة لوحة الأدمن
    let clients = JSON.parse(localStorage.getItem('clientsData')) || [
      { code: '101', name: 'أحمد محمود', plan: 'اشتراك شهري', expiry: '2026-10-30' },
      { code: '102', name: 'محمد علي', plan: 'تدريب خاص (Private)', expiry: '2026-11-15' }
    ];

    function saveData() {
      localStorage.setItem('clientsData', JSON.stringify(clients));
      renderAdminTable();
    }

    function addClient(e) {
      e.preventDefault();
      const name = document.getElementById('adminName').value.trim();
      const code = document.getElementById('adminCode').value.trim();
      const plan = document.getElementById('adminPlan').value.trim();
      const expiry = document.getElementById('adminExpiry').value;

      const existingIndex = clients.findIndex(c => c.code === code);
      if (existingIndex > -1) {
        clients[existingIndex] = { code, name, plan, expiry };
      } else {
        clients.push({ code, name, plan, expiry });
      }

      saveData();
      document.getElementById('addClientForm').reset();
      alert('تم حفظ بيانات المشترك في اللوحة بنجاح');
    }

    function renderAdminTable() {
      const tbody = document.getElementById('clientsTableBody');
      tbody.innerHTML = '';
      clients.forEach(client => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${client.code}</td>
          <td>${client.name}</td>
          <td>${client.plan}</td>
          <td>${client.expiry}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 3. حساب معادلة Harris-Benedict والماكروز وتحويل التقرير لرقمك مباشرة
    function processAndSend(e) {
      e.preventDefault();

      const name = document.getElementById('clientName').value.trim();
      const gender = document.getElementById('clientGender').value;
      const age = parseFloat(document.getElementById('clientAge').value);
      const weight = parseFloat(document.getElementById('clientWeight').value);
      const height = parseFloat(document.getElementById('clientHeight').value);
      const activityMult = parseFloat(document.getElementById('clientActivity').value);

      // حساب الـ BMR بمُعادلة Harris-Benedict
      let bmr = 0;
      if (gender === 'male') {
        bmr = 88.362 + (13.397 * weight) + (4.799 * height) - (5.677 * age);
      } else {
        bmr = 447.593 + (9.247 * weight) + (3.098 * height) - (4.330 * age);
      }

      // حساب الاحتياج الكلي TDEE
      const tdee = bmr * activityMult;

      // حساب الماكروز (بروتين، كربوهيدرات، دهون)
      const proteinGrams = Math.round((tdee * 0.30) / 4);
      const carbGrams = Math.round((tdee * 0.40) / 4);
      const fatGrams = Math.round((tdee * 0.30) / 9);

      const activityTextMap = {
        "1.2": "خامل (1.2)",
        "1.375": "خفيف (1.375)",
        "1.55": "متوسط (1.55)",
        "1.725": "عالي (1.725)",
        "1.9": "عالي جداً (1.9)"
      };

      // الرقم الخاص بك بكود مصر
      const myPhoneNumber = "201033338892";
      
      // تجهيز الرسالة
      let message = `📋 *تقييم وتفاصيل جديد لمشترك* %0A%0A`;
      message += `👤 *الاسم:* ${name}%0A`;
      message += `🚻 *النوع:* ${gender === 'male' ? 'ذكر' : 'أنثى'}%0A`;
      message += `🎂 *العمر:* ${age} سنة%0A`;
      message += `⚖️ *الوزن:* ${weight} كجم%0A`;
      message += `📏 *الطول:* ${height} سم%0A`;
      message += `🏃‍♂️ *معامل النشاط:* ${activityTextMap[activityMult]}%0A`;
      message += `-----------------------------------%0A`;
      message += `🔥 *معدل الأيض الأساسي (BMR):* ${Math.round(bmr)} سعرة%0A`;
      message += `⚡ *الاحتياج اليومي (TDEE):* ${Math.round(tdee)} سعرة%0A`;
      message += `-----------------------------------%0A`;
      message += `🎯 *توزيع الماكروز المقترح:*%0A`;
      message += `🥩 *البروتين:* ${proteinGrams} جرام%0A`;
      message += `🍚 *الكارب:* ${carbGrams} جرام%0A`;
      message += `🥑 *الدهون:* ${fatGrams} جرام%0A`;

      // إعادة ضبط النموذج وإبراز رسالة النجاح
      document.getElementById('clientForm').reset();
      document.getElementById('successMessage').style.display = 'block';

      // التحويل التلقائي لفتح الواتساب ورسالتك جاهزة
      const whatsappUrl = `https://wa.me/${myPhoneNumber}?text=${message}`;
      setTimeout(() => {
        window.location.href = whatsappUrl;
      }, 1200);
    }

    // التشغيل الأول لتنسيق الجدول
    renderAdminTable();
  </script>
</body>
</html>
