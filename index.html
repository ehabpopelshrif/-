<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة المشتركين واللوحة - Captain Ehab</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: #f1f5f9;
    }

    .tab-btn {
      flex: 1;
      padding: 15px;
      border: none;
      background: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      color: #64748b;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }

    .tab-content {
      padding: 24px;
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    input, select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .btn-submit {
      background: var(--accent);
    }

    .btn-submit:hover {
      background: #059669;
    }

    .divider {
      margin: 30px 0;
      border: 0;
      border-top: 1px dashed var(--border);
    }

    .section-title {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #0f172a;
    }

    .success-msg {
      display: none;
      text-align: center;
      color: #059669;
      margin-top: 15px;
      font-weight: bold;
      background: #ecfdf5;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #a7f3d0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 10px;
      text-align: right;
    }

    th {
      background: #f8fafc;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- أزرار التنقل بين التبويبات -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('client-tab')">دخول المشتركين</button>
      <button class="tab-btn" onclick="switchTab('admin-tab')">لوحة الأدمن</button>
    </div>

    <!-- تبويب المشتركين -->
    <div id="client-tab" class="tab-content active">
      <h2>مرحباً بك في حسابك</h2>
      
      <!-- 1. استعلام الكود للعميل -->
      <form id="clientLoginForm" onsubmit="handleClientLogin(event)">
        <div class="form-group">
          <label for="clientCode">كود المشترك / رقم الهاتف</label>
          <input type="text" id="clientCode" placeholder="أدخل كود الاشتراك الخاص بك" required>
        </div>
        <button type="submit" class="btn">عرض البيانات والتفاصيل</button>
      </form>
      
      <div id="clientResult" style="margin-top: 20px; display: none;">
        <h3>بيانات الاشتراك:</h3>
        <p><strong>الاسم:</strong> <span id="resName">-</span></p>
        <p><strong>الباقة:</strong> <span id="resPlan">-</span></p>
        <p><strong>تاريخ الانتهاء:</strong> <span id="resExpiry">-</span></p>
      </div>

      <hr class="divider">

      <!-- 2. نموذج تسجيل البيانات البدنية والحسابات للواتساب -->
      <h3 class="section-title">تسجيل بيانات التقييم البدني والرياضي</h3>
      <form id="calcForm" onsubmit="processAndSend(event)">
        <div class="form-group">
          <label>اسم المشترك بالكامل:</label>
          <input type="text" id="calcName" placeholder="أدخل اسمك" required>
        </div>
        
        <div class="form-group">
          <label>النوع:</label>
          <select id="calcGender" required>
            <option value="male">ذكر</option>
            <option value="female">أنثى</option>
          </select>
        </div>

        <div class="form-group">
          <label>السن (بالسنوات):</label>
          <input type="number" id="calcAge" placeholder="مثال: 28" required>
        </div>

        <div class="form-group">
          <label>الوزن (بالكيلوجرام):</label>
          <input type="number" id="calcWeight" step="0.1" placeholder="مثال: 85" required>
        </div>

        <div class="form-group">
          <label>الطول (بالسنتيمتر):</label>
          <input type="number" id="calcHeight" placeholder="مثال: 178" required>
        </div>

        <div class="form-group">
          <label>مستوى النشاط والمجهود البدني:</label>
          <select id="calcActivity" required>
            <option value="1.2">خامل (قليل الحركة / بدون تمارين)</option>
            <option value="1.375">خفيف (تمارين 1-3 أيام في الأسبوع)</option>
            <option value="1.55">متوسط (تمارين 3-5 أيام في الأسبوع)</option>
            <option value="1.725">عالي (تمارين شاقة 6-7 أيام في الأسبوع)</option>
            <option value="1.9">عالي جداً (رياضي محترف / مجهود بدني شاق)</option>
          </select>
        </div>

        <button type="submit" class="btn btn-submit">إرسال البيانات لكابتن إيهاب</button>
      </form>

      <div id="successMessage" class="success-msg">
        ✓ تم إرسال البيانات بنجاح لكابتن إيهاب! جاري فتح الواتساب للتأكيد...
      </div>
    </div>

    <!-- تبويب الأدمن -->
    <div id="admin-tab" class="tab-content">
      <h2>إدارة المشتركين (الأدمن)</h2>
      <form id="addClientForm" onsubmit="addClient(event)">
        <div class="form-group">
          <label for="adminName">اسم المشترك</label>
          <input type="text" id="adminName" required>
        </div>
        <div class="form-group">
          <label for="adminCode">كود/رقم المشترك</label>
          <input type="text" id="adminCode" required>
        </div>
        <div class="form-group">
          <label for="adminPlan">نوع الاشتراك / الباقة</label>
          <input type="text" id="adminPlan" placeholder="مثال: باقة 3 شهور" required>
        </div>
        <div class="form-group">
          <label for="adminExpiry">تاريخ الانتهاء</label>
          <input type="date" id="adminExpiry" required>
        </div>
        <button type="submit" class="btn">إضافة / تحديث المشترك</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>الكود</th>
            <th>الاسم</th>
            <th>الباقة</th>
            <th>تاريخ الانتهاء</th>
          </tr>
        </thead>
        <tbody id="clientsTableBody">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // 1. إدارة المشتركين
    let clients = JSON.parse(localStorage.getItem('clientsData')) || [
      { code: '101', name: 'أحمد محمود', plan: 'اشتراك شهري', expiry: '2026-10-30' },
      { code: '102', name: 'محمد علي', plan: 'تدريب خاص (Private)', expiry: '2026-11-15' }
    ];

    function saveData() {
      localStorage.setItem('clientsData', JSON.stringify(clients));
      renderAdminTable();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    function handleClientLogin(e) {
      e.preventDefault();
      const codeInput = document.getElementById('clientCode').value.trim();
      const client = clients.find(c => c.code === codeInput);

      if (client) {
        document.getElementById('resName').textContent = client.name;
        document.getElementById('resPlan').textContent = client.plan;
        document.getElementById('resExpiry').textContent = client.expiry;
        document.getElementById('clientResult').style.display = 'block';
      } else {
        alert('كود المشترك غير موجود، يرجى التأكد وإعادة المحاولة.');
        document.getElementById('clientResult').style.display = 'none';
      }
    }

    function addClient(e) {
      e.preventDefault();
      const name = document.getElementById('adminName').value.trim();
      const code = document.getElementById('adminCode').value.trim();
      const plan = document.getElementById('adminPlan').value.trim();
      const expiry = document.getElementById('adminExpiry').value;

      const existingIndex = clients.findIndex(c => c.code === code);
      if (existingIndex > -1) {
        clients[existingIndex] = { code, name, plan, expiry };
      } else {
        clients.push({ code, name, plan, expiry });
      }

      saveData();
      document.getElementById('addClientForm').reset();
      alert('تم حفظ البيانات بنجاح');
    }

    function renderAdminTable() {
      const tbody = document.getElementById('clientsTableBody');
      tbody.innerHTML = '';
      clients.forEach(client => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${client.code}</td>
          <td>${client.name}</td>
          <td>${client.plan}</td>
          <td>${client.expiry}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 2. معادلة BMR وحساب الماكروز وإرسال التقرير للواتساب
    function processAndSend(e) {
      e.preventDefault();

      const name = document.getElementById('calcName').value.trim();
      const gender = document.getElementById('calcGender').value;
      const age = parseFloat(document.getElementById('calcAge').value);
      const weight = parseFloat(document.getElementById('calcWeight').value);
      const height = parseFloat(document.getElementById('calcHeight').value);
      const activityMult = parseFloat(document.getElementById('calcActivity').value);

      // معادلة Harris-Benedict
      let bmr = 0;
      if (gender === 'male') {
        bmr = 88.362 + (13.397 * weight) + (4.799 * height) - (5.677 * age);
      } else {
        bmr = 447.593 + (9.247 * weight) + (3.098 * height) - (4.330 * age);
      }

      const tdee = bmr * activityMult;

      const proteinGrams = Math.round((tdee * 0.30) / 4);
      const carbGrams = Math.round((tdee * 0.40) / 4);
      const fatGrams = Math.round((tdee * 0.30) / 9);

      const activityTextMap = {
        "1.2": "خامل (1.2)",
        "1.375": "خفيف (1.375)",
        "1.55": "متوسط (1.55)",
        "1.725": "عالي (1.725)",
        "1.9": "عالي جداً (1.9)"
      };

      const myPhoneNumber = "201033338892";
      
      let message = `📋 *تقرير تقييم جديد لمشترك* %0A%0A`;
      message += `👤 *الاسم:* ${name}%0A`;
      message += `🚻 *النوع:* ${gender === 'male' ? 'ذكر' : 'أنثى'}%0A`;
      message += `🎂 *العمر:* ${age} سنة%0A`;
      message += `⚖️ *الوزن:* ${weight} كجم%0A`;
      message += `📏 *الطول:* ${height} سم%0A`;
      message += `🏃‍♂️ *معامل النشاط:* ${activityTextMap[activityMult]}%0A`;
      message += `-----------------------------------%0A`;
      message += `🔥 *معدل الأيض الأساسي (BMR):* ${Math.round(bmr)} سعرة%0A`;
      message += `⚡ *الاحتياج اليومي (TDEE):* ${Math.round(tdee)} سعرة%0A`;
      message += `-----------------------------------%0A`;
      message += `🎯 *توزيع الماكروز المقترح:*%0A`;
      message += `🥩 *البروتين:* ${proteinGrams} جرام%0A`;
      message += `🍚 *الكارب:* ${carbGrams} جرام%0A`;
      message += `🥑 *الدهون:* ${fatGrams} جرام%0A`;

      document.getElementById('calcForm').reset();
      document.getElementById('successMessage').style.display = 'block';

      const whatsappUrl = `https://wa.me/${myPhoneNumber}?text=${message}`;
      setTimeout(() => {
        window.location.href = whatsappUrl;
      }, 1000);
    }

    // التشغيل الأول
    renderAdminTable();
  </script>
</body>
</html>
