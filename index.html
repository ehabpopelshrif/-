<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل بيانات العميل - Captain POP</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body { background: #0f0f11; color: #fff; display: flex; justify-content: center; padding: 20px; margin: 0; }
    .card { background: #18181c; border: 1px solid #2a2a30; border-radius: 16px; width: 100%; max-width: 500px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { text-align: center; color: #ffb703; margin-top: 0; font-weight: 900; }
    p.subtitle { text-align: center; color: #aaa; font-size: 14px; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #ccc; }
    input, select { width: 100%; padding: 12px; background: #222228; border: 1px solid #33333d; border-radius: 8px; color: #fff; font-size: 15px; outline: none; }
    input:focus, select:focus { border-color: #ffb703; }
    button { width: 100%; padding: 14px; background: #25D366; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    button:hover { background: #1da851; }
  </style>
</head>
<body>

<div class="card">
  <h2>بيانات التقييم الرياضي</h2>
  <p class="subtitle">أدخل بياناتك وسيتم إرسال التقرير للمدرب فوراً</p>

  <form id="calcForm">
    <div class="form-group">
      <label>اسمك بالكامل:</label>
      <input type="text" id="clientName" placeholder="أدخل اسمك" required>
    </div>
    
    <div class="form-group">
      <label>الجنس:</label>
      <select id="gender">
        <option value="male">ذَكَر</option>
        <option value="female">أنثى</option>
      </select>
    </div>

    <div class="form-group">
      <label>السن (سنة):</label>
      <input type="number" id="age" placeholder="مثال: 25" required>
    </div>

    <div class="form-group">
      <label>الوزن (كجم):</label>
      <input type="number" id="weight" step="0.1" placeholder="مثال: 80" required>
    </div>

    <div class="form-group">
      <label>الطول (سم):</label>
      <input type="number" id="height" placeholder="مثال: 175" required>
    </div>

    <div class="form-group">
      <label>مستوى النشاط اليومي:</label>
      <select id="activity">
        <option value="1.2">خامل (بدون تمرين / عمل مكتبي)</option>
        <option value="1.375">نشاط خفيف (تمرين 1-3 أيام/أسبوع)</option>
        <option value="1.55">نشاط متوسط (تمرين 3-5 أيام/أسبوع)</option>
        <option value="1.725">نشاط عالي (تمرين 6-7 أيام/أسبوع)</option>
        <option value="1.9">نشاط شاق جداً (تمرين مرتين يومياً / عمل بدني شاق)</option>
      </select>
    </div>

    <button type="submit">إرسال البيانات للكابتن إيهاب 📲</button>
  </form>
</div>

<script>
  // 🟢 رقم تليفون الكابتن لاستقبال التقارير
  const COACH_PHONE_NUMBER = "201033338892"; 

  document.getElementById('calcForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const name = document.getElementById('clientName').value;
    const gender = document.getElementById('gender').value;
    const age = parseFloat(document.getElementById('age').value);
    const weight = parseFloat(document.getElementById('weight').value);
    const height = parseFloat(document.getElementById('height').value);
    const activityFactor = parseFloat(document.getElementById('activity').value);

    // 1. حساب BMR بمعادلة Harris-Benedict المعدلة (1984)
    let bmr = 0;
    if (gender === 'male') {
      bmr = 88.362 + (13.397 * weight) + (4.799 * height) - (5.677 * age);
    } else {
      bmr = 447.593 + (9.247 * weight) + (3.098 * height) - (4.330 * age);
    }

    // 2. حساب TDEE (سعرات المحافظة)
    const tdee = bmr * activityFactor;

    // 3. حساب الماكروز المقترحة
    const proteinGrams = weight * 2;
    const proteinCalories = proteinGrams * 4;

    const fatCalories = tdee * 0.25;
    const fatGrams = fatCalories / 9;

    const carbsCalories = tdee - (proteinCalories + fatCalories);
    const carbsGrams = carbsCalories / 4;

    // 4. تجهيز الرسالة المنسقة للكابتن
    const genderText = gender === 'male' ? 'ذكر' : 'أنثى';
    
    const message = 
`📋 *تقرير جديد لعميل - Captain POP*

👤 *الاسم:* ${name}
🧬 *الجنس:* ${genderText} | *السن:* ${age} سنة
📏 *الطول:* ${height} سم | ⚖️ *الوزن:* ${weight} كجم

---------------------------------
🔥 *معدل الحرق الأساسي (BMR):* ${Math.round(bmr)} سعرة
🏃 *معامل النشاط:* ×${activityFactor}
💥 *احتياج المحافظة (TDEE):* ${Math.round(tdee)} سعرة

---------------------------------
🍽️ *توزيع الماكروز المقترح:*
💪 *البروتين:* ${Math.round(proteinGrams)} جرام
🥑 *الدهون الصحية:* ${Math.round(fatGrams)} جرام
🍞 *الكاربوهيدرات:* ${Math.round(carbsGrams)} جرام`;

    // 5. فتح الواتساب مباشرة لرقم الكابتن
    const encodedMessage = encodeURIComponent(message);
    const whatsappUrl = `https://wa.me/${COACH_PHONE_NUMBER}?text=${encodedMessage}`;
    
    window.location.href = whatsappUrl;
  });
</script>

</body>
</html>
