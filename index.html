<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة الكابتن - BMR & Macros</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body { background: #0f0f11; color: #fff; display: flex; justify-content: center; padding: 20px; margin: 0; }
    .card { background: #18181c; border: 1px solid #2a2a30; border-radius: 16px; width: 100%; max-width: 500px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { text-align: center; color: #ffb703; margin-top: 0; font-weight: 900; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #ccc; }
    input, select { width: 100%; padding: 12px; background: #222228; border: 1px solid #33333d; border-radius: 8px; color: #fff; font-size: 15px; outline: none; }
    input:focus, select:focus { border-color: #ffb703; }
    button { width: 100%; padding: 14px; background: #ffb703; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    button:hover { background: #e0a100; }
    .result-box { display: none; background: #222228; border-radius: 10px; padding: 15px; margin-top: 20px; border-right: 4px solid #ffb703; }
    .result-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
    .result-item strong { color: #ffb703; }
    .send-btn { background: #25D366; color: #fff; margin-top: 15px; }
    .send-btn:hover { background: #1da851; }
  </style>
</head>
<body>

<div class="card">
  <h2>حاسبة BMR والماكروز</h2>
  <form id="calcForm">
    <div class="form-group">
      <label>اسم العميل:</label>
      <input type="text" id="clientName" placeholder="مثال: أحمد محمد" required>
    </div>
    
    <div class="form-group">
      <label>الجنس:</label>
      <select id="gender">
        <option value="male">ذَكَر</option>
        <option value="female">أنثى</option>
      </select>
    </div>

    <div class="form-group">
      <label>السن (سنة):</label>
      <input type="number" id="age" placeholder="25" required>
    </div>

    <div class="form-group">
      <label>الوزن (كجم):</label>
      <input type="number" id="weight" step="0.1" placeholder="80" required>
    </div>

    <div class="form-group">
      <label>الطول (سم):</label>
      <input type="number" id="height" placeholder="175" required>
    </div>

    <div class="form-group">
      <label>مستوى النشاط:</label>
      <select id="activity">
        <option value="1.2">خامل (بدون تمرين / عمل مكتبي)</option>
        <option value="1.375">نشاط خفيف (تمرين 1-3 أيام/أسبوع)</option>
        <option value="1.55">نشاط متوسط (تمرين 3-5 أيام/أسبوع)</option>
        <option value="1.725">نشاط عالي (تمرين 6-7 أيام/أسبوع)</option>
        <option value="1.9">نشاط شاق جداً (تمرين مرتين يومياً / عمل بدني شاق)</option>
      </select>
    </div>

    <button type="submit">احسب البيانات</button>
  </form>

  <div class="result-box" id="resultBox">
    <h3>نتيجة التقرير:</h3>
    <div class="result-item"><span>معدل الأيض (BMR):</span> <strong id="resBmr">0</strong> سعرة</div>
    <div class="result-item"><span>معامل النشاط:</span> <strong id="resFactor">0</strong></div>
    <div class="result-item"><span>سعرات المحافظة (TDEE):</span> <strong id="resTdee">0</strong> سعرة</div>
    <hr style="border-color: #333;">
    <div class="result-item"><span>البروتين:</span> <strong id="resProtein">0</strong> جرام</div>
    <div class="result-item"><span>الدهون الصحية:</span> <strong id="resFat">0</strong> جرام</div>
    <div class="result-item"><span>الكاربوهيدرات:</span> <strong id="resCarbs">0</strong> جرام</div>

    <button class="send-btn" onclick="sendToCoachWhatsApp()">إرسال التقرير للواتساب 📲</button>
  </div>
</div>

<script>
  // 🟢 تم تثبيت رقم الكابتن للتقارير المباشرة
  const COACH_PHONE_NUMBER = "201033338892"; 

  let calculatedData = {};

  document.getElementById('calcForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const name = document.getElementById('clientName').value;
    const gender = document.getElementById('gender').value;
    const age = parseFloat(document.getElementById('age').value);
    const weight = parseFloat(document.getElementById('weight').value);
    const height = parseFloat(document.getElementById('height').value);
    const activityFactor = parseFloat(document.getElementById('activity').value);

    // 1. حساب BMR معادلة Harris-Benedict المعدلة
    let bmr = 0;
    if (gender === 'male') {
      bmr = 88.362 + (13.397 * weight) + (4.799 * height) - (5.677 * age);
    } else {
      bmr = 447.593 + (9.247 * weight) + (3.098 * height) - (4.330 * age);
    }

    // 2. حساب TDEE
    const tdee = bmr * activityFactor;

    // 3. حساب الماكروز
    const proteinGrams = weight * 2;
    const proteinCalories = proteinGrams * 4;

    const fatCalories = tdee * 0.25;
    const fatGrams = fatCalories / 9;

    const carbsCalories = tdee - (proteinCalories + fatCalories);
    const carbsGrams = carbsCalories / 4;

    calculatedData = {
      name, gender: gender === 'male' ? 'ذكر' : 'أنثى', age, weight, height,
      activityFactor,
      bmr: Math.round(bmr),
      tdee: Math.round(tdee),
      protein: Math.round(proteinGrams),
      fat: Math.round(fatGrams),
      carbs: Math.round(carbsGrams)
    };

    // عرض النتيجة على الشاشة
    document.getElementById('resBmr').innerText = calculatedData.bmr;
    document.getElementById('resFactor').innerText = `× ${calculatedData.activityFactor}`;
    document.getElementById('resTdee').innerText = calculatedData.tdee;
    document.getElementById('resProtein').innerText = `${calculatedData.protein}g (${Math.round(proteinCalories)} cal)`;
    document.getElementById('resFat').innerText = `${calculatedData.fat}g (${Math.round(fatCalories)} cal)`;
    document.getElementById('resCarbs').innerText = `${calculatedData.carbs}g (${Math.round(carbsCalories)} cal)`;

    document.getElementById('resultBox').style.display = 'block';
  });

  function sendToCoachWhatsApp() {
    const d = calculatedData;
    
    const message = 
`📋 *تقرير جديد لعميل - Captain POP*

👤 *الاسم:* ${d.name}
🧬 *الجنس:* ${d.gender} | *السن:* ${d.age} سنة
📏 *الطول:* ${d.height} سم | ⚖️ *الوزن:* ${d.weight} كجم

---------------------------------
🔥 *معدل الحرق الأساسي (BMR):* ${d.bmr} سعرة
🏃 *معامل النشاط:* ×${d.activityFactor}
💥 *احتياج المحافظة (TDEE):* ${d.tdee} سعرة

---------------------------------
🍽️ *توزيع الماكروز المقترح:*
💪 *البروتين:* ${d.protein} جرام
🥑 *الدهون الصحية:* ${d.fat} جرام
🍞 *الكاربوهيدرات:* ${d.carbs} جرام`;

    const encodedMessage = encodeURIComponent(message);
    const whatsappUrl = `https://wa.me/${COACH_PHONE_NUMBER}?text=${encodedMessage}`;
    
    window.open(whatsappUrl, '_blank');
  }
</script>

</body>
</html>
